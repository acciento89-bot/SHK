name: SHK Suite CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - run: swift test

  ios-builds:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scheme: [KalteCalc, LueftungsCalc, HeizkoerperCalc, RohrCalc, AnlagenCheck, HeizBalance]
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Verify export compliance declaration
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(xcodebuild -project KamilunavoSHK.xcodeproj -scheme "${{ matrix.scheme }}" -showBuildSettings)
          grep -Eq '^[[:space:]]*INFOPLIST_KEY_ITSAppUsesNonExemptEncryption = NO$' <<<"$SETTINGS"
          grep -Eq '^[[:space:]]*CURRENT_PROJECT_VERSION = 2$' <<<"$SETTINGS"
      - name: Build ${{ matrix.scheme }}
        run: xcodebuild -project KamilunavoSHK.xcodeproj -scheme "${{ matrix.scheme }}" -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build HeizBalance Release
        if: matrix.scheme == 'HeizBalance'
        run: xcodebuild -project KamilunavoSHK.xcodeproj -scheme HeizBalance -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build
