name: SHK Suite CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - run: swift test

  ios-builds:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scheme: [KalteCalc, LueftungsCalc, HeizkoerperCalc, RohrCalc, AnlagenCheck]
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Verify export compliance declaration
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(xcodebuild -project KamilunavoSHK.xcodeproj -scheme "${{ matrix.scheme }}" -showBuildSettings)
          grep -Eq '^[[:space:]]*INFOPLIST_KEY_ITSAppUsesNonExemptEncryption = NO$' <<<"$SETTINGS"
          EXPECTED_BUILD=5
          if [ "${{ matrix.scheme }}" = AnlagenCheck ]; then EXPECTED_BUILD=2; fi
          grep -Eq "^[[:space:]]*CURRENT_PROJECT_VERSION = ${EXPECTED_BUILD}$" <<<"$SETTINGS"
      - name: Build ${{ matrix.scheme }}
        run: xcodebuild -project KamilunavoSHK.xcodeproj -scheme "${{ matrix.scheme }}" -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Validate unsigned Release compilation
        if: matrix.scheme != 'AnlagenCheck'
        run: xcodebuild -project KamilunavoSHK.xcodeproj -scheme "${{ matrix.scheme }}" -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build

  field-device-tests:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scheme: [KalteCalc, LueftungsCalc, HeizkoerperCalc, RohrCalc]
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Validate persisted workflow on iPhone and iPad
        run: python3 scripts/review-device-tests.py "${{ matrix.scheme }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-${{ matrix.scheme }}
          path: review-results
          if-no-files-found: error
          retention-days: 14
