name: Probe SHK Android signing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-android-signing.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app_id:
          - kaltecalc
          - lueftungscalc
          - heizkoerpercalc
          - rohrcalc
          - anlagencheck
          - servicecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore candidate identity from KMS vault
        uses: acciento89-bot/maengelfix/.github/actions/restore-android-signing@main
        with:
          app-id: ${{ matrix.app_id }}
      - name: Report certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$ANDROID_UPLOAD_KEYSTORE_PATH" \
            -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" \
            | grep -E 'SHA1:|SHA256:'
      - name: Destroy restored signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/kamilunavo-upload.jks"
          rm -rf "$RUNNER_TEMP/kamilunavo-signing-vault"
