name: Android Play Release Suite

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-play-release.yml"
  push:
    branches:
      - main
      - android/play-release-suite
    paths:
      - "android/**"
      - ".github/workflows/android-play-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify RohrCalc launcher and Play icon identity
        shell: bash
        run: |
          set -euo pipefail
          LAUNCHER='android/app/src/rohrcalc/res/drawable/ic_launcher.xml'
          PLAY='android/store/google-play/rohrcalc.svg'
          for token in '#07182A' '#225460' '#68F0CA' '#ECF7FA' '#5AD2FF'; do
            grep -Fq "$token" "$LAUNCHER"
            grep -Fq "$token" "$PLAY"
          done
          grep -Fq 'M30,42H67V73' "$LAUNCHER"
          grep -Fq 'M30 42H67V73' "$PLAY"
          grep -Fq 'M25,42H34M67,68V78' "$LAUNCHER"
          grep -Fq 'M25 42H34M67 68V78' "$PLAY"
      - name: Build all Play bundles
        run: >-
          gradle -p android
          bundleKaltecalcRelease
          bundleLueftungscalcRelease
          bundleHeizkoerpercalcRelease
          bundleRohrcalcRelease
          bundleAnlagencheckRelease
      - name: Render canonical RohrCalc Play icon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p android/play-assets/rohrcalc
          convert -background none android/store/google-play/rohrcalc.svg android/play-assets/rohrcalc/icon-512.png
          identify -format '%wx%h' android/play-assets/rohrcalc/icon-512.png | grep -Fx '512x512'
          test "$(stat -c%s android/play-assets/rohrcalc/icon-512.png)" -lt 1048576
          sha256sum android/play-assets/rohrcalc/icon-512.png > android/play-assets/rohrcalc/icon-512.png.sha256
      - name: Upload Play release assets
        uses: actions/upload-artifact@v4
        with:
          name: shk-play-release-assets
          path: |
            android/app/build/outputs/bundle/*Release/*.aab
            android/play-assets/rohrcalc/icon-512.png
            android/play-assets/rohrcalc/icon-512.png.sha256
          if-no-files-found: error
          retention-days: 14
