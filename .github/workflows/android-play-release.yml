name: Android Play Release Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-play-release.yml"

permissions:
  contents: read
  id-token: write

env:
  EXPECTED_VERSION_CODE: '2'
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Restore shared SHK upload identity from KMS vault
        uses: acciento89-bot/maengelfix/.github/actions/restore-android-signing@main
        with:
          app-id: kaltecalc
      - name: Verify all launcher and Play icon sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          pairs = {
              'kaltecalc': ('android/app/src/kaltecalc/res/drawable/ic_launcher.xml', 'android/store/google-play/kaltecalc.svg'),
              'lueftungscalc': ('android/app/src/lueftungscalc/res/drawable/ic_launcher.xml', 'android/store/google-play/lueftungscalc.svg'),
              'heizkoerpercalc': ('android/app/src/heizkoerpercalc/res/drawable/ic_launcher.xml', 'android/store/google-play/heizkoerpercalc.svg'),
              'rohrcalc': ('android/app/src/rohrcalc/res/drawable/ic_launcher.xml', 'android/store/google-play/rohrcalc.svg'),
              'anlagencheck': ('android/app/src/anlagencheck/res/drawable/ic_launcher.xml', 'android/store/google-play/anlagencheck.svg'),
          }
          for app, (launcher_path, play_path) in pairs.items():
              launcher = Path(launcher_path).read_text()
              play = Path(play_path).read_text()
              launcher_colors = sorted(set(re.findall(r'#[0-9A-Fa-f]{6}', launcher)))
              play_colors = sorted(set(re.findall(r'#[0-9A-Fa-f]{6}', play)))
              if launcher_colors != play_colors:
                  raise SystemExit(f'{app}: color palette differs: {launcher_colors} != {play_colors}')
              launcher_paths = [re.sub(r'[ ,]', '', p) for p in re.findall(r'android:pathData="([^"]+)"', launcher)]
              play_paths = [re.sub(r'[ ,]', '', p) for p in re.findall(r'<path[^>]*\bd="([^"]+)"', play)]
              for path in launcher_paths:
                  if path not in play_paths:
                      raise SystemExit(f'{app}: launcher path missing from Play SVG: {path}')
              print(f'{app}: launcher/store source parity OK')
          PY
      - name: Install Android SDK and icon renderer
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
      - name: Build all signed Play bundles
        run: >-
          gradle -p android
          bundleKaltecalcRelease
          bundleLueftungscalcRelease
          bundleHeizkoerpercalcRelease
          bundleRohrcalcRelease
          bundleAnlagencheckRelease
          --stacktrace
      - name: Verify signed bundles and render canonical Play icons
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 2' android/app/build.gradle.kts
          for app in kaltecalc lueftungscalc heizkoerpercalc rohrcalc anlagencheck; do
            aab="android/app/build/outputs/bundle/${app}Release/app-${app}-release.aab"
            test -s "$aab"
            jarsigner -verify "$aab" | grep -Fq 'jar verified.'
            mkdir -p "android/play-assets/$app"
            rsvg-convert -w 512 -h 512 "android/store/google-play/$app.svg" -o "android/play-assets/$app/icon-512.png"
            test "$(file -b --mime-type "android/play-assets/$app/icon-512.png")" = 'image/png'
            test "$(stat -c%s "android/play-assets/$app/icon-512.png")" -lt 1048576
            sha256sum "android/play-assets/$app/icon-512.png" > "android/play-assets/$app/icon-512.png.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: shk-play-1.0.1-2-release-assets
          path: |
            android/app/build/outputs/bundle/*Release/*.aab
            android/play-assets/*/icon-512.png
            android/play-assets/*/icon-512.png.sha256
          if-no-files-found: error
          retention-days: 30
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Upload missing version 2 bundles to Google Play
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://androidpublisher.googleapis.com/androidpublisher/v3'
          upload='https://androidpublisher.googleapis.com/upload/androidpublisher/v3'
          cat > "$RUNNER_TEMP/shk-targets.tsv" <<'EOF'
          kaltecalc|de.kamilunav.kaltecalc
          lueftungscalc|de.kamilunavo.luftungscalc
          heizkoerpercalc|de.kamilunavo.heizkorpercalc
          rohrcalc|de.kamilunavo.rohrcalc
          anlagencheck|de.kamilunavo.servicecheck
          EOF
          while IFS='|' read -r app package; do
            aab="android/app/build/outputs/bundle/${app}Release/app-${app}-release.aab"
            edit=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$package/edits" | jq -r '.id')
            bundles=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$api/applications/$package/edits/$edit/bundles")
            if jq -e --argjson code "$EXPECTED_VERSION_CODE" '.bundles | any(.versionCode == $code)' <<<"$bundles" >/dev/null; then
              echo "$package versionCode $EXPECTED_VERSION_CODE already exists; skipping upload"
              curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$package/edits/$edit" >/dev/null
              continue
            fi
            body=$(mktemp)
            status=$(curl -sS -o "$body" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/octet-stream' --data-binary "@$aab" "$upload/applications/$package/edits/$edit/bundles?uploadType=media")
            if [[ "$status" != 200 ]]; then cat "$body" >&2; curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$package/edits/$edit" >/dev/null || true; exit 1; fi
            test "$(jq -r '.versionCode' "$body")" = "$EXPECTED_VERSION_CODE"
            status=$(curl -sS -o "$body" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$package/edits/$edit:commit")
            [[ "$status" == 2* ]] || { cat "$body" >&2; exit 1; }
            fresh=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$package/edits" | jq -r '.id')
            curl -fsS -H "Authorization: Bearer $TOKEN" "$api/applications/$package/edits/$fresh/bundles" | jq -e --argjson code "$EXPECTED_VERSION_CODE" '.bundles | any(.versionCode == $code)' >/dev/null
            curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$package/edits/$fresh" >/dev/null
            echo "$package versionCode $EXPECTED_VERSION_CODE uploaded and verified"
          done < "$RUNNER_TEMP/shk-targets.tsv"
      - name: Destroy restored signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/kamilunavo-upload.jks"
          rm -rf "$RUNNER_TEMP/kamilunavo-signing-vault"
